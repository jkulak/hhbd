 ; hhbd-app application.ini file
 ; Rendered by Chef - local changes will be replaced

[production]
phpSettings.display_startup_errors = 0
phpSettings.display_errors = 0
phpSettings.date.timezone = "Europe/Warsaw"
phpSettings.error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED & ~E_WARNING

resources.frontController.params.displayExceptions = 0

bootstrap.path = APPLICATION_PATH "/Bootstrap.php"
bootstrap.class = "Bootstrap"

autoloadernamespaces.jkl = Jkl_

; Database - credentials come from environment variables (DB_HOST, DB_USER, DB_PASSWORD, DB_NAME)
resources.db.adapter = PDO_MYSQL
resources.db.params.port = 3306
resources.db.params.charset = utf8mb4

resources.frontController.controllerDirectory = APPLICATION_PATH "/controllers"
resources.frontController.baseUrl = /
resources.layout.layoutpath = APPLICATION_PATH "/layouts"

; Feature flags - override with SHOW_ADS env var
app.showAds = 1
; Google Analytics 4's measurement id, from GA_MEASUREMENT_ID; none, no analytics (#161)
app.gaMeasurementId = ""


; Where the content volume is served; album_covers paths are under it (#60)
app.paths.contentPath = /content/
app.paths.albumCoverPath = /content/a/
app.paths.albumThumbnailPath = /content/a/th/
app.paths.albumThumbnailSuffix = -th.jpg

app.paths.artistPhotoPath = /content/p/
app.paths.labelLogoPath = /content/l/
; A news item's image (news.graph), by its file name (#133)
app.paths.newsImagePath = /content/news/

; ***********
; * MAIL - override with MAIL_HOST, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM_EMAIL, MAIL_FROM_NAME env vars
; ***********
resources.mail.transport.type = smtp
resources.mail.transport.host = localhost
resources.mail.transport.auth = login
resources.mail.transport.ssl = ssl
resources.mail.transport.username = ""
resources.mail.transport.password = ""
resources.mail.defaultFrom.email = noreply@hhbd.pl
resources.mail.defaultFrom.name = Hhbd

; ***********
; * LOGGERS
; ***********

; One writer, to stderr, where PHP-FPM passes it on to the container log and the host's
; collector picks it up. There used to be two files, one for emergencies and one for
; everything; on one stream the emergency writer would only print each emergency twice.
; Each event is one JSON line in the shared host's format (#101, Jkl_Log).
resources.log.stderr.writerName = "Stream"
resources.log.stderr.writerParams.stream = "php://stderr"
resources.log.stderr.writerParams.mode = "a"
resources.log.stderr.formatterName = "Json"
resources.log.stderr.formatterNamespace = "Jkl_Log_Formatter"

[staging : production]

[testing : production]
phpSettings.display_startup_errors = 1
phpSettings.display_errors = 1
phpSettings.error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

[development : production]
phpSettings.display_startup_errors = 1
phpSettings.display_errors = 1
; phpSettings.error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE
phpSettings.error_reporting = E_ALL
