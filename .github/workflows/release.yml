name: Release

# A release is a CalVer tag, vYYYY.MM.N, and tagging is a person's decision. The tag's images
# are built, pushed privately to GHCR and rolled out to the OVH host through ci-deploy
# (CONTRACT.md §5 and §6 in jkulak/gcloud-ovh-migrate). workflow_dispatch runs it again for a
# tag that exists: pick the tag under "Use workflow from".
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One release at a time, and none stopped halfway: a deploy cancelled in the middle of a roll
# is worse than one that waits.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/jkulak/hhbd

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything but a release tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ] || ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::A release is a tag vYYYY.MM.N; this run is on $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
          echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile-php
          target: production
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_PREFIX }}-app:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push the nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile-nginx
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_PREFIX }}-nginx:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: Pin the host and load the deploy key
        env:
          OVH_DEPLOY_SSH_KEY: ${{ secrets.OVH_DEPLOY_SSH_KEY }}
          OVH_HOST_KEY: ${{ secrets.OVH_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          # The host's known_hosts line, so the connection is pinned; never
          # StrictHostKeyChecking=no.
          printf '%s\n' "$OVH_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$OVH_DEPLOY_SSH_KEY" > ~/.ssh/ovh-deploy
          chmod 600 ~/.ssh/ovh-deploy ~/.ssh/known_hosts

      - name: Deploy, smoke-test, and go back on a failed smoke test
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          # A repository variable, "true" until hhbd.pl points at the OVH host and the edge
          # lets only Cloudflare in. deploy/README.md says when to turn it off.
          SMOKE_VIA_ORIGIN: ${{ vars.SMOKE_VIA_ORIGIN }}
        run: ./deploy/ovh-release.sh "$TAG"
