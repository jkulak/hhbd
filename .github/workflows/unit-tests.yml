name: Unit Tests

# Pull requests only: the merge result is tested on the pull request, so a push to main
# would only run the same thing again.
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: '8.4'
          # gd for the importer's image sizes (#96), as the importer image has it; pdo_pgsql for
          # Jkl_Db's connection options. No coverage: its upload failed on every run and nobody
          # received it (#206).
          extensions: mbstring, xml, pdo, pdo_pgsql, gd
          coverage: none

      # No cache: a pull request's Actions cache is read by its own later pushes alone, and
      # nothing runs on main to leave one the next pull request could read (#206).
      - name: Install Composer dependencies
        working-directory: app
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        working-directory: app
        run: ./vendor/bin/phpunit -c tests/phpunit.xml

      # make how names targets by name: one renamed or removed must not leave a step behind it.
      - name: Check make how names real targets
        run: ./tests/make-how-test.sh
