name: Smoke Tests

# Pull requests only: the merge result is tested on the pull request, so a push to main
# would only run the same thing again.
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: smoke-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    name: smoke-tests (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two halves at once, each on its own runner with its own stack and database: the site's
        # pages, and the tools that change the database. One after the other they took eight
        # minutes.
        part: [site, tools]
    env:
      COMPOSE_PROJECT_NAME: hhbd
      HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Docker Hub counts anonymous pulls per address, and GitHub's runners share theirs with every
      # other build, which used up the limit and failed ours with 429 (#135). Logged in, the pulls
      # count against the account. Skipped where the token is not given, as on a fork's PR.
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Each image keeps its cache under its own scope: in one shared scope, each build's
      # export replaced the one before it, and the app's image was built from scratch on
      # every run. Only the site half writes the cache; the tools half reads the same.
      - name: Build app image with cache (builder target)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile-php
          target: builder
          tags: |
            ${{ env.COMPOSE_PROJECT_NAME }}-app:latest
          load: true
          cache-from: type=gha,scope=smoke-app
          cache-to: ${{ matrix.part == 'site' && 'type=gha,mode=max,scope=smoke-app' || '' }}

      - name: Build nginx image with cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile-nginx
          tags: |
            ${{ env.COMPOSE_PROJECT_NAME }}-nginx:latest
          load: true
          cache-from: type=gha,scope=smoke-nginx
          cache-to: ${{ matrix.part == 'site' && 'type=gha,mode=max,scope=smoke-nginx' || '' }}

      - name: Build importer image with cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile-php
          target: importer
          tags: |
            ${{ env.COMPOSE_PROJECT_NAME }}-importer:latest
          load: true
          cache-from: type=gha,scope=smoke-importer
          cache-to: ${{ matrix.part == 'site' && 'type=gha,mode=max,scope=smoke-importer' || '' }}

      - name: Start Docker Compose services
        run: |
          # compose.ci.yaml runs the app on the builder stage, which has composer, unzip and git
          docker compose -f compose.yaml -f compose.ci.yaml up -d
          echo "Waiting for services to start..."

      - name: Install Composer dependencies in app container
        run: |
          # Bind mount hides image-installed vendor, so install deps inside the running container
          docker compose exec -T app composer install --no-interaction --prefer-dist --no-progress
          echo "Composer dependencies installed!"

      - name: Wait for database to be healthy
        run: |
          echo "Waiting for database..."
          timeout 60 bash -c 'until docker compose exec -T db mysqladmin ping -h localhost -u root -proot_password --silent; do sleep 2; done'
          echo "Database is ready!"

      - name: Load the schema and the fixtures
        run: |
          # The schema from the migrations, the fixtures onto the baseline, the later migrations
          # over that data: the one way a database is set up here, locally and in CI alike.
          make reset-db

      - name: Generate test images
        run: |
          # In the importer's image, the one with GD
          make test-images

      - name: Wait for PHP-FPM to be healthy
        run: |
          echo "Waiting for PHP-FPM..."
          timeout 60 bash -c 'until docker compose exec -T app php-fpm-healthcheck 2>/dev/null; do sleep 2; done'
          echo "PHP-FPM is ready!"

      # The site's half

      - name: Describe the covers and photos, and check the backfills
        if: matrix.part == 'site'
        run: |
          # As production's existing covers and photos get described (#60, #61), so the pages
          # read the tables; the test checks the dry run and a second run on the way.
          ./tests/backfill-test.sh

      - name: Verify APPLICATION_ENV
        if: matrix.part == 'site'
        run: |
          echo "=== Checking APPLICATION_ENV ==="
          docker compose exec -T app bash -c 'echo "Shell: APPLICATION_ENV=$APPLICATION_ENV"'
          docker compose exec -T app php -r 'echo "PHP: APPLICATION_ENV=" . getenv("APPLICATION_ENV") . "\n";'

      - name: Run smoke tests
        if: matrix.part == 'site'
        run: |
          bash ./tests/smoke-test.sh http://localhost:8080

      - name: Check the images the catalogue names
        if: matrix.part == 'site'
        run: |
          # Every cover, thumbnail, photo and logo the fixtures name is in content/ (#47).
          ./scripts/check-images.sh

      - name: Check the schema rules
        if: matrix.part == 'site'
        run: |
          # Every table InnoDB (#45); added never changes on update, the catalog's added has a
          # default, no zero-date defaults, and a page view leaves added and updated alone (#48).
          ./tests/schema-test.sh http://localhost:8080

      - name: Check settling what an import left
        if: matrix.part == 'site'
        run: |
          # As the fixtures' admin, through the site's forms: a merge, keep, qualifier, cover,
          # date and type, and forms that must not count; it ends with a reset (#103).
          ./tests/review-test.sh http://localhost:8080

      # The tools' half

      - name: Check make reset-db
        if: matrix.part == 'tools'
        run: |
          # Resets, row counts, the kept result against a build from the migrations, and the
          # cases it must refuse.
          ./tests/reset-db-test.sh

      - name: Check the migration runner
        if: matrix.part == 'tools'
        run: |
          # Up, down, a failing migration, the baseline, the refusals, and the ssh path through
          # a stand-in, all on the same stack; it ends with a reset.
          ./tests/migrate-test.sh

      - name: Check the importer
        if: matrix.part == 'tools'
        run: |
          # The test batch: a dry run, an apply, the same apply again, and a batch with
          # documents that do not hold up; it ends with a reset (#56).
          ./tests/import-test.sh http://localhost:8080

      - name: Check an admin's edits and their undo
        if: matrix.part == 'tools'
        run: |
          # make edit's merges, deletes and set, each applied and undone, the data compared
          # before and after; it ends with a reset (#115).
          ./tests/edit-test.sh http://localhost:8080

      - name: Show logs on failure
        if: failure()
        run: |
          # PHP, the application and nginx all log to the containers' stdout and stderr.
          docker compose logs --tail=200

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
