name: Deploy checks

# What a release to the OVH host depends on, checked on every pull request: no secret in the
# tree, and the production stack itself behind a stand-in edge. How a release rolls out is the
# shared host's template, tested where it is kept. Nothing runs again on the merge to main; the
# pull request tested the merge result.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: No secret in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/secrets-check.sh

  ovh-e2e:
    name: Production stack behind the edge
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      # Docker Hub counts anonymous pulls per address, and GitHub's runners share theirs with every
      # other build, which used up the limit and failed ours with 429 (#135). Logged in, the pulls
      # count against the account. Skipped where the token is not given, as on a fork's PR.
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB_TOKEN == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
      # The three images under the tag the test runs, built here with the layer cache rather
      # than by the test itself, which builds them without one when run on a laptop.
      - name: Build the app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile-php
          target: production
          platforms: linux/amd64
          tags: ghcr.io/jkulak/hhbd-app:stacktest
          load: true
          cache-from: type=gha,scope=stacktest-app
          cache-to: type=gha,mode=max,scope=stacktest-app
      - name: Build the nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile-nginx
          platforms: linux/amd64
          tags: ghcr.io/jkulak/hhbd-nginx:stacktest
          load: true
          cache-from: type=gha,scope=stacktest-nginx
          cache-to: type=gha,mode=max,scope=stacktest-nginx
      - name: Build the importer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile-php
          target: importer
          platforms: linux/amd64
          tags: ghcr.io/jkulak/hhbd-importer:stacktest
          load: true
          cache-from: type=gha,scope=stacktest-importer
          cache-to: type=gha,mode=max,scope=stacktest-importer
      - run: ./tests/ovh-e2e.sh
        env:
          STACKTEST_PREBUILT: "1"
