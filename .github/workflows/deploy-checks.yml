name: Deploy checks

# What a release to the OVH host depends on, checked on every pull request: no secret in the
# tree, the release flow, the data move, and the production stack itself behind a stand-in
# edge. Nothing runs again on the merge to main; the pull request tested the merge result.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: No secret in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/secrets-check.sh

  release-flow:
    name: Release flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/ovh-release-test.sh

  ovh-stack:
    name: Production stack behind the edge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/ovh-stack-test.sh
