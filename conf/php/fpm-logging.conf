; Where PHP-FPM's logs go. Loaded after the image's own docker.conf, so these win.

[global]
; Warnings and errors only: the master's start-up notices ("fpm is running", "ready to handle
; connections") are lines in FPM's own format, which the shared host asks of no image the
; service builds (#101; CONTRACT.md §9 in gcloud-ovh-migrate).
log_level = warning
; A worker's line passes whole up to here, so a JSON line with its stack, which Jkl_Log keeps
; under 16 000 bytes, is not wrapped into several.
log_limit = 16384

; The php image already sends worker output to the master's log, which is the container's
; stderr. Stated here as well, so the application's logs do not depend on a default of the
; base image: PHP's error_log and Zend_Log both write to a worker's stderr, and without
; catch_workers_output that output is thrown away.
[www]
catch_workers_output = yes
decorate_workers_output = no

; No per-request access log from FPM. nginx logs every request already, and the edge in front
; of it logs them again; FPM's copy would add a third line per request, plus one for every
; healthcheck of this container.
access.log = /dev/null
