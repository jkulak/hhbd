; Production PHP configuration

[PHP]
; Disable error display in production
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED & ~E_STRICT & ~E_WARNING

; Logging - log errors but don't display them
log_errors = On
; stderr, never a file: a file inside the container is a log nobody reads and a disk that
; slowly fills. In a PHP-FPM worker, stderr reaches the container log through
; catch_workers_output (conf/php/fpm-logging.conf).
error_log = /proc/self/fd/2

; Opcache - production settings (no file checks)
opcache.enable = 1
opcache.revalidate_freq = 60
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 10000
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16

; Security
expose_php = Off

; Production limits
memory_limit = 256M
max_execution_time = 30
