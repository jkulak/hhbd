; PHP-FPM as the containers run it, in place of Debian's own www.conf (Dockerfile-php). Read
; before zz-hhbd-logging.conf (fpm-logging.conf here), which says where the logs go.

[global]
; FPM's own lines on stderr, the container's log, rather than Debian's /var/log/php8.4-fpm.log.
; It runs in the foreground: the image starts it with --nodaemonize.
error_log = /proc/self/fd/2

[www]
user = www-data
group = www-data
; nginx reaches it over the compose network
listen = 9000
; The environment reaches the application, which reads its configuration with getenv():
; DB_HOST, MAIL_*, IMPORT_USER_ID and the rest. FPM would clear it.
clear_env = no
; The healthcheck asks this over FastCGI (conf/php/php-fpm-healthcheck). nginx passes only the
; .php files it has (#34), so the page is not reachable from outside.
pm.status_path = /status
; As the php image had it: a small host, at most five requests at once
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
