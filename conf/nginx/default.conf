# The client's address. On the OVH host the shared edge sets X-Real-IP after resolving
# Cloudflare's forwarding, and it always connects from its fixed address on the edge network.
# Trusted from that address only: from anywhere else the header is the client's own claim, and
# a comment would be stored with whatever address it chose. Elsewhere this is a no-op.
set_real_ip_from 172.30.0.2;
real_ip_header X-Real-IP;

# The scheme the client used. Cloudflare and the edge take every request over HTTPS and pass it
# on as plain HTTP with X-Forwarded-Proto: https, which PHP never saw, so the application took
# every request for http and wrote http:// into its canonical tags and sitemaps (#147). Only the
# edge reaches nginx on the host; elsewhere a client's claim decides nothing but a URL's scheme.
map $http_x_forwarded_proto $forwarded_https {
    https   on;
    default "";
}

# No access log: the shared edge logs every request, with the request id it hands on as
# X-Request-Id, and a second line per request here would be one in another format (#101;
# CONTRACT.md §9 in gcloud-ovh-migrate). The error log stays on stderr, in nginx's own format,
# which the host's collector reads; a missing file is the edge's 404, not an error line.
access_log off;
error_log /dev/stderr warn;
log_not_found off;

# Redirect www to non-www
server {
    listen 80;
    server_name www.hhbd.pl;
    return 301 https://hhbd.pl$request_uri;
}

server {
    listen 80;
    server_name hhbd.pl localhost;
    root /var/www/html/app/public;
    index index.php index.html;
    charset utf-8;

    # Nothing whose path has a part starting with a dot: an .htaccess served to anyone until #139,
    # and whatever such file comes next. Before the .php location, which would match first.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Only a script nginx has in its own copy of public/ goes to PHP-FPM; any other .php,
        # /wp-login.php and the like from bots, is a 404 here. Passed on, PHP-FPM answered it
        # with "File not found." and nginx logged its "Primary script unknown" at error (#34).
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $forwarded_https if_not_empty;
        # A response larger than the buffers, such as the song sitemap, is passed on as it comes
        # rather than spooled to a temporary file, which nginx announced with a warn line in
        # its own format on every such request (#101).
        fastcgi_max_temp_file_size 0;
    }

    # Content files: covers, photos and logos from the content volume. A file the catalogue
    # names but the volume lacks (#47) still answers 404, so a check of the files sees it, but
    # with a placeholder from the image as its body, so a page shows the placeholder instead of
    # a broken image.
    location ^~ /content/a/th/ {
        root /var/www/html;
        charset utf-8;
        try_files $uri =404;
        error_page 404 /img/placeholder/cover-75.png;
    }

    location ^~ /content/a/ {
        root /var/www/html;
        charset utf-8;
        try_files $uri =404;
        error_page 404 /img/placeholder/cover.png;
    }

    location ^~ /content/p/ {
        root /var/www/html;
        charset utf-8;
        try_files $uri =404;
        error_page 404 /img/placeholder/photo.png;
    }

    location ^~ /content/l/ {
        root /var/www/html;
        charset utf-8;
        try_files $uri =404;
        error_page 404 /img/placeholder/logo.png;
    }

    location ^~ /content/ {
        root /var/www/html;
        charset utf-8;
    }
}
