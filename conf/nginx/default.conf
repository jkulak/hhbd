# Logs go to the container's stdout and stderr, where the host's collector reads them.
# Requests from inside the container are the healthcheck's, every few seconds; they stay out.
map $remote_addr $loggable {
    127.0.0.1 0;
    default   1;
}
error_log /dev/stderr;

# Redirect www to non-www
server {
    listen 80;
    server_name www.hhbd.pl;
    access_log /dev/stdout main if=$loggable;
    return 301 https://hhbd.pl$request_uri;
}

server {
    listen 80;
    server_name hhbd.pl localhost;
    root /var/www/html/app/public;
    index index.php index.html;
    charset utf-8;
    access_log /dev/stdout main if=$loggable;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Content files (covers, images)
    location ~ ^/content/(.*)$ {
        alias /var/www/html/content/$1;
        charset utf-8;
    }
}
