services:
  # Frontend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile-php
      target: production
    volumes:
      - ./app:/var/www/html/app
      - ./content:/var/www/html/content
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: db
      DB_NAME: hhbd
      DB_USER: hhbd
      DB_PASSWORD: hhbd_password
      # The salt of the MD5 passwords from before #41: the fixtures' own here; production's
      # comes with a dump, in .env
      LEGACY_PASSWORD_SALT: ${LEGACY_PASSWORD_SALT:-fixtures-legacy-salt}
      # Feature flags
      SHOW_ADS: "true"
    healthcheck:
      test: [ "CMD", "php-fpm-healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # The import job (#56): reads a batch, streamed in as a tar, into the catalogue and writes its
  # images into content/. It runs and exits, so `up` never starts it: make import BATCH=...
  importer:
    build:
      context: .
      dockerfile: Dockerfile-php
      target: importer
    profiles: [jobs]
    volumes:
      - ./app:/var/www/html/app
      - ./content:/var/www/html/content
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: hhbd
      DB_USER: hhbd
      DB_PASSWORD: hhbd_password

  # Nginx Web Server
  nginx:
    build:
      context: .
      dockerfile: Dockerfile-nginx
    ports:
      - "8080:80"
    volumes:
      - ./app/public:/var/www/html/app/public
      - ./content:/var/www/html/content
      - ./conf/nginx:/etc/nginx/conf.d
    depends_on:
      app:
        condition: service_started

  # MariaDB Database (Alpine-based, ~50MB)
  db:
    image: mariadb:10.11.8
    ports:
      - "3306:3306"
    # The same flags as production (deploy/ovh/compose.yaml has the reasoning)
    command: >
      --innodb-buffer-pool-size=96M --innodb-buffer-pool-dump-at-shutdown=1 --innodb-buffer-pool-load-at-startup=1 --max-connections=20 --innodb-log-file-size=16M --innodb-flush-log-at-trx-commit=2 --innodb-read-io-threads=4 --innodb-write-io-threads=1 --table-open-cache=400 --innodb-stats-on-metadata=0 --transaction-isolation=READ-COMMITTED --skip-name-resolve --key-buffer-size=8M --aria-pagecache-buffer-size=32M --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION,NO_ZERO_IN_DATE,NO_ZERO_DATE
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: hhbd
      MYSQL_USER: hhbd
      MYSQL_PASSWORD: hhbd_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Adminer (lightweight database management)
  adminer:
    image: adminer:latest
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
