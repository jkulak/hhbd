services:
  # Frontend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile-php
      target: production
    volumes:
      - ./app:/var/www/html/app
      - ./content:/var/www/html/content
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: hhbd
      DB_USER: hhbd
      DB_PASSWORD: hhbd_password
      # The salt of the MD5 passwords from before #41: the fixtures' own here; production's
      # comes with a dump, in .env
      LEGACY_PASSWORD_SALT: ${LEGACY_PASSWORD_SALT:-fixtures-legacy-salt}
      # Google Analytics 4 (#161): none here, so nothing measured, unless .env sets one to test
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      # IndexNow (#220): no key here, so nothing is sent, unless .env sets one to test
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      # Feature flags
      SHOW_ADS: "true"
      # Each page's number of queries in the header X-Query-Count (#255), for
      # tests/query-count-test.sh; production's compose file leaves it out
      QUERY_COUNT_HEADER: "true"
    healthcheck:
      test: [ "CMD", "php-fpm-healthcheck" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # The import job (#56): reads a batch, streamed in as a tar, into the catalogue and writes its
  # images into content/. It runs and exits, so `up` never starts it: make import BATCH=...
  importer:
    build:
      context: .
      dockerfile: Dockerfile-php
      target: importer
    profiles: [jobs]
    volumes:
      - ./app:/var/www/html/app
      - ./content:/var/www/html/content
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: hhbd
      DB_USER: hhbd
      DB_PASSWORD: hhbd_password

  # Nginx Web Server
  nginx:
    build:
      context: .
      dockerfile: Dockerfile-nginx
    ports:
      - "8080:80"
    volumes:
      - ./app/public:/var/www/html/app/public
      - ./content:/var/www/html/content
      - ./conf/nginx:/etc/nginx/conf.d
    depends_on:
      app:
        condition: service_started

  # PostgreSQL 17, production's version (#229), sorting in Polish: ICU's pl, set when the
  # cluster is made
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    # The same flags as production (deploy/ovh/compose.yaml has the reasoning)
    command: >
      postgres -c shared_buffers=128MB -c effective_cache_size=192MB -c random_page_cost=1.1 -c shared_preload_libraries=pg_prewarm -c max_connections=40
    environment:
      POSTGRES_USER: hhbd
      POSTGRES_PASSWORD: hhbd_password
      POSTGRES_DB: hhbd
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=pl-PL --locale=C.UTF-8"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hhbd", "-d", "hhbd"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Adminer (lightweight database management): System PostgreSQL, user hhbd
  adminer:
    image: adminer:latest
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
