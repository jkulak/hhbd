#
# HHBD - production on the shared OVH host
#
# Follows CONTRACT.md §2 in jkulak/gcloud-ovh-migrate at 5f9a189. `make ovh-install` copies
# it to /srv/hhbd/compose.yaml; the host's ci-deploy rolls it with IMAGE_TAG set and the
# values of hhbd.enc.env in the environment, and waits for every container to be healthy.
#
# Nothing is published: the shared edge reaches the live colour's nginx over the `edge`
# network, and the database is reached over ssh with `docker exec`. No adminer: if one is ever
# needed, it runs ad hoc on 127.0.0.1 and is removed after.
#
# nginx and the app, the request's path, run in two colours (CONTRACT.md §2): a deploy starts
# the idle one on the new tag beside the live one and moves the edge to it once it is healthy,
# so no request waits on a release. Each colour has a network of its own on which only its app
# answers to `app`, so nginx's `fastcgi_pass app:9000` finds its own colour's. The database and
# the importer run once.
#
name: hhbd

# All that both colours of nginx share; what differs, the tag, the labels and the networks, is
# in each.
x-nginx: &nginx
  restart: unless-stopped
  volumes:
    - content:/var/www/html/content:ro
  healthcheck:
    # The home page, through nginx, PHP and the database. A colour that starts but cannot
    # render a page is not healthy, and the edge never moves to it. By IPv4 with the Host header
    # set, since nginx listens on IPv4 only and "localhost" may resolve to ::1 first.
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header", "Host: localhost", "http://127.0.0.1/"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 20s
  deploy:
    resources:
      limits:
        memory: 64M

# All that every app container shares: both colours, and the one-off one below.
x-app: &app
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment:
    APPLICATION_ENV: production
    DB_HOST: db
    DB_NAME: hhbd
    DB_USER: hhbd
    DB_PASSWORD: ${DB_PASSWORD:?}
    # The salt of the MD5 passwords from before #41, until no account has one (hhbd.enc.env)
    LEGACY_PASSWORD_SALT: ${LEGACY_PASSWORD_SALT:?}
    # Google Analytics 4 (#161): not a secret; a stack test sets it empty, so it sends nothing
    GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID-G-200N6YNR76}
    # IndexNow's key (#220): not a secret, the site serves it at /<key>.txt; a stack test sets it
    # empty, so it tells nobody of its pages
    INDEXNOW_KEY: ${INDEXNOW_KEY-095d8dc57ae6f64f3993fc81770366eb}
    SHOW_ADS: "true"
  healthcheck:
    # PHP-FPM answers its status page over FastCGI.
    test: ["CMD", "php-fpm-healthcheck"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 10s
  deploy:
    resources:
      limits:
        memory: 256M

services:
  nginx-blue:
    <<: *nginx
    # Each colour on its own tag, so deploying one leaves the other as it is.
    image: ghcr.io/jkulak/hhbd-nginx:${IMAGE_TAG_BLUE:-${IMAGE_TAG:?}}
    depends_on:
      app-blue:
        condition: service_healthy
    labels:
      deploy.colour: blue
      # Where the edge sends hhbd while blue is live.
      deploy.upstream: hhbd-blue-web:80
      # What the host's nightly backup takes (its CONTRACT.md §8); both colours name it, and it
      # is taken once.
      backup.volumes: content
    networks:
      blue: {}
      edge:
        aliases: [hhbd-blue-web]

  app-blue:
    <<: *app
    image: ghcr.io/jkulak/hhbd-app:${IMAGE_TAG_BLUE:-${IMAGE_TAG:?}}
    labels:
      deploy.colour: blue
    networks:
      default: {}
      blue:
        aliases: [app]

  nginx-green:
    <<: *nginx
    image: ghcr.io/jkulak/hhbd-nginx:${IMAGE_TAG_GREEN:-${IMAGE_TAG:?}}
    depends_on:
      app-green:
        condition: service_healthy
    labels:
      deploy.colour: green
      deploy.upstream: hhbd-green-web:80
      backup.volumes: content
    networks:
      green: {}
      edge:
        aliases: [hhbd-green-web]

  app-green:
    <<: *app
    image: ghcr.io/jkulak/hhbd-app:${IMAGE_TAG_GREEN:-${IMAGE_TAG:?}}
    labels:
      deploy.colour: green
    networks:
      default: {}
      green:
        aliases: [app]

  # The app's own tools, run once against production by `make ovh-covers-backfill` and the like:
  # the live tag, under a profile, so `up` never starts it.
  app:
    <<: *app
    image: ghcr.io/jkulak/hhbd-app:${IMAGE_TAG:?}
    profiles: [jobs]
    restart: "no"

  # The import job (#56), run by `make ovh-import` with a batch streamed in over ssh. It runs
  # and exits, so it carries a profile and `up` never starts it (CONTRACT.md §6); ci-deploy
  # does not pull it either, so `make ovh-import` does. The one container that writes content.
  importer:
    image: ghcr.io/jkulak/hhbd-importer:${IMAGE_TAG:?}
    profiles: [jobs]
    environment:
      APPLICATION_ENV: production
      DB_HOST: db
      DB_NAME: hhbd
      DB_USER: hhbd
      DB_PASSWORD: ${DB_PASSWORD:?}
      # What an applied import adds, told to IndexNow (#220), as the app's
      INDEXNOW_KEY: ${INDEXNOW_KEY-095d8dc57ae6f64f3993fc81770366eb}
    volumes:
      - content:/var/www/html/content
    deploy:
      resources:
        limits:
          memory: 640M

  db:
    image: mariadb:10.11.8
    restart: unless-stopped
    # Read-optimized for a 33 MB all-InnoDB database (writes ~100/week), tuned in 887938f and #67:
    # - the InnoDB buffer pool holds all data and indexes about three times over (152 disk reads
    #   in 142 million requests on production);
    # - the MyISAM key cache is down to 8 MB from its 128 MB default, since no table is MyISAM
    #   since #45;
    # - the Aria page cache, which holds on-disk temporary tables (86% of them, because the
    #   queries carry TEXT columns), is down to 32 MB from 128 MB: ample for a small site.
    # - sql_mode is MariaDB's default plus NO_ZERO_IN_DATE and NO_ZERO_DATE, so no zero date is
    #   written again once 0018 and 0024-0027 cleared them (#88).
    # Keep compose.yaml and compose.ci.yaml on the same flags, so tests see what production sees.
    command: >
      --innodb-buffer-pool-size=96M --innodb-buffer-pool-dump-at-shutdown=1 --innodb-buffer-pool-load-at-startup=1 --max-connections=20 --innodb-log-file-size=16M --innodb-flush-log-at-trx-commit=2 --innodb-read-io-threads=4 --innodb-write-io-threads=1 --table-open-cache=400 --innodb-stats-on-metadata=0 --transaction-isolation=READ-COMMITTED --skip-name-resolve --key-buffer-size=8M --aria-pagecache-buffer-size=32M --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION,NO_ZERO_IN_DATE,NO_ZERO_DATE
    # The host's nightly backup dumps this database, as root with the password this container
    # was started with, read inside it (its CONTRACT.md §8).
    labels:
      backup.mariadb: hhbd
      backup.password-env: MYSQL_ROOT_PASSWORD
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
      MYSQL_DATABASE: hhbd
      MYSQL_USER: hhbd
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Accepts connections and InnoDB has finished starting.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 320M

  # PostgreSQL 17, hhbd's database once production moves to it (#229, #236): the one engine
  # the host's services run, bankdata's version. Beside MariaDB until the move; the app reads
  # it once its environment says DB_ADAPTER=pdo_pgsql. The schema comes from
  # database/migrations-postgresql (DB_ENGINE=postgresql make ovh-migrate), the data from
  # make ovh-pg-copy; the cluster sorts in Polish, ICU's pl, set when it is made. The role is the
  # image's superuser, hhbd, with the password the app uses, which the host's nightly backup
  # dumps as (its CONTRACT.md §8).
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # The whole database in memory: 53 MB with its indexes, so 128 MB of shared buffers hold it
    # twice over, and the planner is told reads come from memory (effective_cache_size,
    # random_page_cost). pg_prewarm's autoprewarm writes down what the buffers hold and loads it
    # back at start, so a restart does not begin from disk. Keep compose.postgresql.yaml on the
    # same flags, so tests see what production sees.
    command: >
      postgres -c shared_buffers=128MB -c effective_cache_size=192MB -c random_page_cost=1.1 -c shared_preload_libraries=pg_prewarm -c max_connections=40
    labels:
      backup.postgres: hhbd
      backup.user: hhbd
    environment:
      POSTGRES_USER: hhbd
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: hhbd
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=pl-PL --locale=C.UTF-8"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      # Accepts connections to hhbd's database.
      test: ["CMD", "pg_isready", "-U", "hhbd", "-d", "hhbd"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 320M

volumes:
  # The database. Backed up as a dump, as db's labels say, not as a volume.
  db_data:
  # PostgreSQL's (#236). Backed up as a dump too, as postgres's labels say.
  pg_data:
  # Covers, photos and logos, hhbd_content on the host. nginx reads it, and the importer job is
  # the one thing that writes it since the backoffice was archived. Backed up as a volume.
  content:

networks:
  # Each colour's own, where nginx finds its app.
  blue: {}
  green: {}
  edge:
    external: true
    name: edge
