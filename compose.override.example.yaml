# The local stack in development mode: copy to compose.override.yaml (git-ignored), which docker
# compose reads by itself.
services:
  app:
    # The builder stage: FPM with composer, unzip and git, so `docker compose exec app composer
    # install` fills app/vendor with the dev dependencies, as CI's app has it (compose.ci.yaml)
    build:
      target: builder
    environment:
      APPLICATION_ENV: development
    volumes:
      # zz-, so it loads after the image's 99-production.ini and its opcache settings win: the
      # code is re-read on every change
      - ./conf/php/development.ini:/etc/php/8.4/fpm/conf.d/zz-development.ini:ro

  db:
    volumes:
      # A dump at database/dev/init.sql (git-ignored), loaded on the first start of an empty
      # volume; see database/README.md
      - ./database/dev:/docker-entrypoint-initdb.d
